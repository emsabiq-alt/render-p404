name: Supertonic TTS (Indonesian)

on:
  workflow_dispatch:
    inputs:
      voice:
        description: 'Voice F1..F5 / M1..M5 (M2 = suara pria ngebass)'
        default: 'M2'

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache HuggingFace model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: supertonic-3

      - name: Install Supertonic
        run: pip install supertonic==1.3.1 soundfile

      - name: Synthesize all scenes (lang=id)
        env:
          VOICE: ${{ inputs.voice }}
        run: |
          python - <<'PY'
          import os, glob, time, wave, contextlib
          import supertonic as s

          tts = s.TTS()
          style = tts.get_voice_style(os.environ.get('VOICE', 'F1'))
          os.makedirs('output/audio_supertonic', exist_ok=True)

          files = sorted(glob.glob('script/*.txt'))
          print(f"Found {len(files)} script files")
          total_audio = 0.0
          t0 = time.time()
          for f in files:
              name = os.path.basename(f)[:-4]
              text = open(f, encoding='utf-8').read().strip()
              wav, _ = tts.synthesize(text, style, lang='id')
              out = f"output/audio_supertonic/{name}.wav"
              tts.save_audio(wav, out)
              with contextlib.closing(wave.open(out, 'rb')) as w:
                  dur = w.getnframes() / float(w.getframerate())
              total_audio += dur
              print(f"ok {name}  {dur:.2f}s")
          elapsed = time.time() - t0
          print(f"=== DONE: {len(files)} files, {total_audio:.1f}s audio in {elapsed:.1f}s CPU ({total_audio/elapsed:.2f}x realtime) ===")
          PY

      - name: Upload VO artifact
        uses: actions/upload-artifact@v4
        with:
          name: vo-supertonic-${{ inputs.voice }}
          path: output/audio_supertonic/
          retention-days: 7

      - name: Commit VO back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/audio_supertonic/
          git commit -m "chore: Supertonic ${{ inputs.voice }} VO for 77 scenes [skip ci]" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
